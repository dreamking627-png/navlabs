# NavLab fund catalog — input for build_holdings_db.py
#
# How to use
# ----------
# 1. For each fund you want holdings for, set rupeevest_schemecode
#    (open the fund on rupeevest.com; the number in the URL is the code).
# 2. Run:  python build_holdings_db.py
# 3. Copy: cp holdings_db/yaml/*.yaml data/funds/
#
# Rupeevest schemecode ≠ AMFI code. They are different ID systems.
# amfi_code is filled where we could match refined/schemes.csv (Direct Growth).
# FoFs / gold / silver / overseas debt are excluded — stock estimator does not apply.
#
# enabled: false  → skipped by the builder

